<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDoリスト</title>
    <script>
      // 描画前にテーマを反映して、ダークモードでも白い画面が一瞬光るのを防ぐ
      // (保存値 → なければ OS の設定。src/useTheme.js と同じ判定)
      try {
        var saved = JSON.parse(localStorage.getItem('todo-app.theme'))
        var dark =
          saved === 'dark' ||
          (saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
